<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A letter for you 💌</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffd9e6; --bg2:#e9d8ff; --rose:#ff5d8f; --deep:#7a2150; --paper:#fffafc;
  --env:#f7b6cc; --env-dark:#ef93b3; --gold:#ffcf5c; --ink:#5b2142;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 20% 15%,var(--bg1),transparent 55%),radial-gradient(circle at 85% 85%,var(--bg2),transparent 55%),#ffeef4;
  overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.heart{position:absolute;bottom:-60px;opacity:.0;animation:floatUp linear forwards;will-change:transform}
@keyframes floatUp{0%{transform:translate(0,0) scale(.6);opacity:0}10%{opacity:.8}100%{transform:translate(var(--dx),-115vh) scale(1.1) rotate(var(--rot));opacity:0}}
.burst{position:fixed;pointer-events:none;z-index:50;font-size:22px;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--bx),var(--by)) scale(.4);opacity:0}}

/* ---------- Envelope scene ---------- */
#scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;z-index:5;transition:opacity .6s,transform .6s}
#scene.gone{opacity:0;transform:translateY(40px) scale(.9);pointer-events:none}
.env-wrap{perspective:900px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-1deg)}}
.env-wrap.opened{animation:none}
.envelope{position:relative;width:min(84vw,340px);aspect-ratio:1.5;cursor:pointer;border:0;background:none;display:block;filter:drop-shadow(0 18px 24px rgba(122,33,80,.28))}
.envelope:focus-visible{outline:4px solid var(--rose);outline-offset:8px;border-radius:12px}
.back{position:absolute;inset:0;background:var(--env-dark);border-radius:12px}
.card{position:absolute;left:8%;right:8%;top:6%;bottom:6%;background:var(--paper);border-radius:6px;transition:transform .9s .55s cubic-bezier(.3,1.4,.5,1)}
.opened .card{transform:translateY(-62%)}
.front{position:absolute;inset:0;border-radius:12px;overflow:hidden;
  background:linear-gradient(135deg,transparent 49.6%,rgba(0,0,0,.07) 50%) 0 0/50% 100% no-repeat,linear-gradient(225deg,transparent 49.6%,rgba(0,0,0,.07) 50%) 100% 0/50% 100% no-repeat,var(--env)}
.front::after{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;background:var(--env);clip-path:polygon(0 100%,50% 18%,100% 100%);filter:brightness(1.03)}
.flap{position:absolute;left:0;right:0;top:0;height:58%;background:var(--env);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease;z-index:3;box-shadow:inset 0 -10px 0 rgba(255,255,255,.0)}
.flap::before{content:"";position:absolute;inset:0;background:linear-gradient(#ffc9db,var(--env));}
.opened .flap{transform:rotateX(180deg);z-index:0}
.to{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-family:'Caveat',cursive;font-size:clamp(20px,6vw,26px);color:var(--deep);z-index:2;font-weight:700}
.stamp{position:absolute;top:9%;right:6%;width:21%;aspect-ratio:.82;background:#fff;padding:5%;z-index:4;transform:rotate(6deg);
  -webkit-mask:radial-gradient(circle 4px at 4px 4px,#0000 98%,#000) -4px -4px/8px 8px;mask:radial-gradient(circle 4px at 4px 4px,#0000 98%,#000) -4px -4px/8px 8px;
  box-shadow:0 2px 4px rgba(0,0,0,.2)}
.stamp i{display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(160deg,#ff8fb1,var(--rose));font-style:normal;font-size:clamp(18px,6vw,26px);animation:beat 1.3s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.seal{position:absolute;left:50%;top:52%;width:17%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;z-index:5;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#ff6f9c,#d62a62);color:#fff;font-size:clamp(18px,6vw,28px);box-shadow:0 4px 8px rgba(0,0,0,.3);animation:beat 1.3s infinite .2s;transition:opacity .3s}
.opened .seal{opacity:0}
.hint{font-size:18px;font-weight:500;color:var(--deep);text-align:center;padding:0 24px;display:flex;flex-direction:column;align-items:center;gap:6px}
.hint .tap{font-size:30px;animation:poke 1.1s infinite}
@keyframes poke{50%{transform:translateY(-8px) scale(1.1)}}

/* ---------- Reader ---------- */
#reader{position:fixed;inset:0;z-index:10;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .7s;-webkit-overflow-scrolling:touch;padding:28px 16px 60px}
#reader.show{opacity:1;visibility:visible}
.paper{position:relative;max-width:560px;margin:0 auto;background:var(--paper);border-radius:10px;padding:34px 26px 40px;box-shadow:0 22px 50px rgba(122,33,80,.25);
  background-image:repeating-linear-gradient(transparent 0 35px,rgba(255,93,143,.14) 35px 36px);transform:translateY(100vh) rotate(-2deg);transition:transform 1.1s cubic-bezier(.2,.9,.3,1.1)}
#reader.show .paper{transform:none}
.paper::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:2px;background:rgba(255,93,143,.25)}
.hand{font-family:'Caveat',cursive;font-weight:500;font-size:clamp(25px,6.6vw,30px);line-height:36px;padding-left:22px}
.hand.greet{font-weight:700;color:var(--rose);font-size:clamp(30px,8vw,38px);line-height:44px;margin-bottom:16px}
.line{opacity:0;transform:translateY(16px);transition:opacity .9s,transform .9s;margin-bottom:36px}
.line.in{opacity:1;transform:none}
.polaroid{position:relative;width:min(78%,300px);margin:8px auto 52px;background:#fff;padding:12px 12px 14px;box-shadow:0 10px 22px rgba(0,0,0,.2);rotate:-3deg;opacity:0;transform:scale(.7);transition:opacity .8s,transform .9s cubic-bezier(.3,1.5,.5,1)}
.polaroid.in{opacity:1;transform:scale(1)}
.polaroid img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#ffe3ec}
.polaroid figcaption{font-family:'Caveat',cursive;font-size:24px;text-align:center;padding-top:8px;color:var(--deep)}
.polaroid::before{content:"";position:absolute;top:-14px;left:50%;width:90px;height:26px;translate:-50% 0;rotate:3deg;background:rgba(255,207,92,.7)}
.polaroid::after{content:"💖";position:absolute;right:-14px;bottom:-16px;font-size:34px;animation:beat 1.5s infinite}
.sign{text-align:right}
.sign b{display:block;font-size:1.3em;color:var(--rose)}
.end{text-align:center;padding-left:0;margin-top:6px}
.btn{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:600;color:#fff;border:0;border-radius:999px;padding:14px 30px;cursor:pointer;background:linear-gradient(135deg,#ff7aa5,var(--rose));box-shadow:0 8px 0 #c2305f,0 14px 20px rgba(194,48,95,.35);transition:transform .15s,box-shadow .15s;animation:wiggle 2.4s infinite}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #c2305f}
.btn:focus-visible{outline:4px solid var(--deep);outline-offset:4px}
@keyframes wiggle{0%,86%,100%{rotate:0deg}90%{rotate:-4deg}94%{rotate:4deg}98%{rotate:-2deg}}
.thanks{font-family:'Caveat',cursive;font-size:clamp(26px,7vw,32px);color:var(--deep);line-height:1.2;margin-top:22px;font-weight:700;opacity:0;transform:scale(.8);transition:.8s}
.thanks.in{opacity:1;transform:none}
#music{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:60;width:46px;height:46px;border-radius:50%;border:0;background:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 12px rgba(122,33,80,.3);display:none}
#music.on{display:block;animation:spin 6s linear infinite}
#music.muted{animation:none;opacity:.7}
@keyframes spin{to{rotate:360deg}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="hearts" aria-hidden="true"></div>
<button id="music" aria-label="Toggle music">🎵</button>

<main id="scene">
  <div class="env-wrap" id="wrap">
    <button class="envelope" id="env" aria-label="Open the letter">
      <div class="back"></div>
      <div class="card"></div>
      <div class="front"></div>
      <div class="flap"></div>
      <div class="to" id="to"></div>
      <div class="stamp"><i>💗</i></div>
      <div class="seal">♥</div>
    </button>
  </div>
  <div class="hint"><span class="tap">👆</span><span id="hint"></span></div>
</main>

<section id="reader" aria-label="Letter"><article class="paper" id="paper"></article></section>
<audio id="audio" loop preload="auto"></audio>

<script src="content.js"></script>
<script>
const L = window.LETTER, $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const HEARTS = ['💖','💗','💕','💞','🩷','💓','✨','🌸'];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

$('to').textContent = L.envelopeTo; $('hint').textContent = L.openHint;

/* floating heart bubbles */
const box = $('hearts');
function spawn(){
  const h = document.createElement('span'); h.className = 'heart';
  h.textContent = HEARTS[Math.random()*HEARTS.length|0];
  h.style.left = Math.random()*100 + 'vw';
  h.style.fontSize = (14 + Math.random()*28) + 'px';
  h.style.setProperty('--dx', (Math.random()*120-60) + 'px');
  h.style.setProperty('--rot', (Math.random()*80-40) + 'deg');
  h.style.animationDuration = (7 + Math.random()*7) + 's';
  box.appendChild(h); setTimeout(() => h.remove(), 15000);
}
let rate = 900; (function loop(){ if(!reduce) spawn(); setTimeout(loop, rate); })();

/* tap bursts */
function burst(x, y, n = 8){
  if (reduce) return;
  for (let i = 0; i < n; i++){
    const b = document.createElement('span'); b.className = 'burst';
    b.textContent = HEARTS[Math.random()*HEARTS.length|0];
    const a = Math.random()*Math.PI*2, d = 50 + Math.random()*70;
    b.style.left = x + 'px'; b.style.top = y + 'px';
    b.style.setProperty('--bx', Math.cos(a)*d + 'px'); b.style.setProperty('--by', Math.sin(a)*d + 'px');
    document.body.appendChild(b); setTimeout(() => b.remove(), 900);
  }
}
addEventListener('pointerdown', e => burst(e.clientX, e.clientY, 5));

/* build letter */
const paper = $('paper'), reveal = [];
const add = (html, cls) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; paper.appendChild(d); reveal.push(d); return d; };
add(esc(L.greeting), 'hand greet line');
L.paragraphs.forEach((p, i) => {
  add(esc(p), 'hand line');
  if (L.photo && i + 1 === L.photoAfterParagraph)
    add(`<img src="${esc(L.photo)}" alt="" onerror="this.src='assets/photo-placeholder.svg'"><figcaption>${esc(L.photoCaption||'')}</figcaption>`, 'polaroid').outerHTML;
});
paper.querySelectorAll('div.polaroid').forEach(d => { const f = document.createElement('figure'); f.className = 'polaroid'; f.innerHTML = d.innerHTML; d.replaceWith(f); reveal[reveal.indexOf(d)] = f; });
add(`${esc(L.signoff)}<b>${esc(L.from)}</b>`, 'hand line sign');
const end = add(`<button class="btn" id="forgive">${esc(L.forgiveButton)}</button><p class="thanks" id="thanks">${esc(L.forgiveMessage)}</p>`, 'hand line end');

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), {root: $('reader'), threshold: .25});

/* audio */
const audio = $('audio'), mBtn = $('music');
audio.src = L.audio; audio.volume = L.audioVolume ?? .7;
audio.addEventListener('error', () => { mBtn.style.display = 'none'; });
mBtn.onclick = () => { if (audio.paused){ audio.play(); mBtn.classList.remove('muted'); } else { audio.pause(); mBtn.classList.add('muted'); } };

/* open */
let opened = false;
function open(){
  if (opened) return; opened = true;
  $('wrap').classList.add('opened');
  audio.play().then(() => mBtn.classList.add('on')).catch(() => {});
  rate = 450;
  const r = $('env').getBoundingClientRect();
  burst(r.left + r.width/2, r.top + r.height/2, 14);
  setTimeout(() => $('scene').classList.add('gone'), 1700);
  setTimeout(() => { $('reader').classList.add('show'); setTimeout(() => reveal.forEach(el => io.observe(el)), 600); }, 1900);
}
$('env').addEventListener('click', open);

/* forgive */
paper.addEventListener('click', e => {
  if (e.target.id !== 'forgive') return;
  $('thanks').classList.add('in'); e.target.style.display = 'none'; rate = 120;
  for (let i = 0; i < 6; i++) setTimeout(() => burst(innerWidth*Math.random(), innerHeight*(.3+Math.random()*.5), 10), i*250);
  setTimeout(() => rate = 450, 6000);
});
</script>
</body>
</html>
